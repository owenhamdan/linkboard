name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate system.yaml and OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validators
        run: pip install -r tools/requirements.txt
      - name: system.yaml against system.schema.json
        run: check-jsonschema --schemafile system.schema.json system.yaml
      - name: OpenAPI documents against the OpenAPI specification
        run: openapi-spec-validator services/links/openapi.yaml services/analytics/openapi.yaml
      - name: system.yaml against the code (env vars, cross service endpoints, paths)
        run: python tools/check_system.py

  test:
    name: test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [links, analytics]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check --config ../../ruff.toml .

      - name: Start SQL Server
        working-directory: .
        run: |
          # Throwaway passwords, generated for this run only and hidden from the log.
          SA_PW="Ci1!$(openssl rand -hex 12)"; LINKS_PW="Ci1!$(openssl rand -hex 12)"; ANALYTICS_PW="Ci1!$(openssl rand -hex 12)"
          echo "::add-mask::$SA_PW"; echo "::add-mask::$LINKS_PW"; echo "::add-mask::$ANALYTICS_PW"
          docker run -d --name mssql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PW" mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 40); do
            docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PW" -Q "SELECT 1" -b >/dev/null 2>&1 && break
            sleep 3
          done
          docker cp db/init.sql mssql:/tmp/init.sql
          docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PW" -b -i /tmp/init.sql \
            -v LINKS_PASSWORD="$LINKS_PW" ANALYTICS_PASSWORD="$ANALYTICS_PW"
          PW=$([ "${{ matrix.service }}" = links ] && echo "$LINKS_PW" || echo "$ANALYTICS_PW")
          echo "TEST_DATABASE_URL=mssql://${{ matrix.service }}_user:${PW//!/%21}@localhost:1433/${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Test with coverage (fails under 70%)
        run: python -m pytest --cov=. --cov-report=term-missing --cov-fail-under=70

  integration:
    name: integration across the seam (compose stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start the whole system
        run: |
          # Throwaway passwords for this run only, so none is written in the repository.
          export MSSQL_SA_PASSWORD="Ci1!$(openssl rand -hex 12)" LINKS_DB_PASSWORD="Ci1!$(openssl rand -hex 12)" ANALYTICS_DB_PASSWORD="Ci1!$(openssl rand -hex 12)"
          echo "::add-mask::$MSSQL_SA_PASSWORD"; echo "::add-mask::$LINKS_DB_PASSWORD"; echo "::add-mask::$ANALYTICS_DB_PASSWORD"
          docker compose up -d --build --wait links analytics
      - name: Run integration tests
        run: |
          pip install -r tests/integration/requirements.txt
          python -m pytest -v -s tests/integration
      - name: Links log while analytics was stopped
        run: docker compose logs --no-color links | grep -E "analytics unavailable|GET /it_|DELETE" | tail -20
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200

  build:
    name: build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [links, analytics]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t linkboard-${{ matrix.service }}:ci services/${{ matrix.service }}
