name: CD

# Runs on every push to main: CI first, then images, then the Azure deploy.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/owenhamdan

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: push ${{ matrix.service }} image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [links, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/linkboard-${{ matrix.service }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PREFIX: ${{ vars.PREFIX }}
      RG: ${{ vars.RESOURCE_GROUP }}
      UI_STORAGE: ${{ vars.UI_STORAGE }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Look up addresses
        run: |
          UI_ORIGIN=$(az storage account show -n "$UI_STORAGE" -g "$RG" --query primaryEndpoints.web -o tsv)
          echo "UI_ORIGIN=${UI_ORIGIN%/}" >> "$GITHUB_ENV"
          for s in links analytics; do
            FQDN=$(az containerapp show -n "$PREFIX-$s" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
            echo "$(echo $s | tr a-z A-Z)_URL=https://$FQDN" >> "$GITHUB_ENV"
          done

      - name: Deploy analytics
        env:
          DB_PASSWORD: ${{ secrets.ANALYTICS_DB_PASSWORD }}
        run: |
          APP="$PREFIX-analytics"
          az containerapp secret set -n "$APP" -g "$RG" -o none \
            --secrets database-url="mssql://analytics_user:${DB_PASSWORD//!/%21}@$PREFIX-sql.database.windows.net:1433/$PREFIX-analytics-db"
          az containerapp ingress update -n "$APP" -g "$RG" --target-port 8000 -o none
          az containerapp update -n "$APP" -g "$RG" -o none \
            --image "$REGISTRY/linkboard-analytics:$SHA" --min-replicas 0 --max-replicas 1 \
            --set-env-vars DATABASE_URL=secretref:database-url CORS_ORIGINS="$UI_ORIGIN" GIT_SHA="$SHA" PORT=8000

      - name: Deploy links
        env:
          DB_PASSWORD: ${{ secrets.LINKS_DB_PASSWORD }}
        run: |
          APP="$PREFIX-links"
          az containerapp secret set -n "$APP" -g "$RG" -o none \
            --secrets database-url="mssql://links_user:${DB_PASSWORD//!/%21}@$PREFIX-sql.database.windows.net:1433/$PREFIX-links-db"
          az containerapp ingress update -n "$APP" -g "$RG" --target-port 8000 -o none
          az containerapp update -n "$APP" -g "$RG" -o none \
            --image "$REGISTRY/linkboard-links:$SHA" --min-replicas 0 --max-replicas 1 \
            --set-env-vars DATABASE_URL=secretref:database-url CORS_ORIGINS="$UI_ORIGIN" GIT_SHA="$SHA" PORT=8000 \
              ANALYTICS_URL="$ANALYTICS_URL" ANALYTICS_TIMEOUT_S=2

      - name: Upload the UI to the static website
        run: |
          cat > ui/config.js <<JS
          // Generated by the CD workflow for commit $SHA.
          window.LINKBOARD_CONFIG = {
            LINKS_URL: "$LINKS_URL",
            ANALYTICS_URL: "$ANALYTICS_URL",
          };
          JS
          az storage blob upload-batch --account-name "$UI_STORAGE" --auth-mode key \
            -d '$web' -s ui --overwrite -o none

      - name: Health check (allows for a cold start and the database resuming)
        run: |
          for url in "$LINKS_URL" "$ANALYTICS_URL"; do
            ok=""
            for i in $(seq 1 30); do
              code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 60 "$url/health" || true)
              echo "$url/health -> $code (attempt $i)"
              if [ "$code" = "200" ] && grep -q "$SHA" /tmp/health.json; then ok=1; cat /tmp/health.json; echo; break; fi
              sleep 10
            done
            [ -n "$ok" ] || { echo "$url never became healthy on $SHA"; exit 1; }
          done
