<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Linkboard</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    input { padding: 6px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    li { margin: 8px 0; }
    #msg { color: #b00; }
  </style>
</head>
<body>
  <h1>Linkboard</h1>
  <form id="f">
    <input name="url" placeholder="https://example.com" required>
    <input name="slug" placeholder="custom slug (optional)">
    <button>Shorten</button>
  </form>
  <p id="msg"></p>
  <ul id="links"></ul>
  <pre id="stats"></pre>
  <script src="config.js"></script>
  <script>
    const { LINKS_URL, ANALYTICS_URL } = window.LINKBOARD_CONFIG;
    const msg = (t) => (document.getElementById("msg").textContent = t);

    async function call(url, opts) {
      try {
        const res = await fetch(url, { ...opts, signal: AbortSignal.timeout(40000) });
        if (res.status === 503) throw new Error("starting up");
        return res;
      } catch (e) {
        msg("A service is starting up or unavailable, please try again in a moment.");
        throw e;
      }
    }

    async function load() {
      const res = await call(`${LINKS_URL}/api/links`);
      const ul = document.getElementById("links");
      ul.innerHTML = "";
      for (const l of await res.json()) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = `${LINKS_URL}/${l.slug}`;
        a.textContent = `/${l.slug}`;
        li.append(a, ` to ${l.url} `);
        const b = document.createElement("button");
        b.textContent = "stats";
        b.onclick = () => showStats(l.slug);
        li.appendChild(b);
        ul.appendChild(li);
      }
    }

    async function showStats(slug) {
      try {
        const res = await call(`${ANALYTICS_URL}/stats/${slug}`);
        document.getElementById("stats").textContent = JSON.stringify(await res.json(), null, 2);
      } catch {
        document.getElementById("stats").textContent = "Stats unavailable right now.";
      }
    }

    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const res = await call(`${LINKS_URL}/api/links`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const body = await res.json();
      if (res.ok) { msg(""); load(); } else msg(body.error);
    };

    load().catch(() => {});
  </script>
</body>
</html>
